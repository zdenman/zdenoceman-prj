<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="icon/euro-blue.png">
    <script src="preferences.js?v=2.0.0"></script>
    <link rel="stylesheet" href="style.css?v=2.0.0">
    <link rel="manifest" href="manifest.json?v=2.0.0" />
    <title>Area / Field Calculator</title>
</head>
<body class="single-panel-page">
    <div class="container" role="main">
        <div class="row">
            <div class="simple-page-header">
                <a href="index.html" class="page-link simple-back-link" data-i18n="back_to_grid">Back to tools</a>
                <h1 data-i18n="menu_area">Area / Field</h1>
            </div>

            <p class="length-intro" data-i18n="area_intro">Convert between metric, imperial and traditional area units</p>

            <div class="unit-pair">
                <div class="unit-select-group">
                    <label for="from-unit" data-i18n="area_from">From</label>
                    <select id="from-unit" aria-label="From unit">
                        <optgroup label="Metric" data-unit-group="metric">
                            <option value="km2" data-i18n-unit data-unit-display="km²">square kilometer (km²)</option>
                            <option value="ha" data-i18n-unit data-unit-display="ha" selected>hectare (ha)</option>
                            <option value="ar" data-i18n-unit data-unit-display="a">are (a)</option>
                            <option value="m2" data-i18n-unit data-unit-display="m²">square meter (m²)</option>
                            <option value="dm2" data-i18n-unit data-unit-display="dm²">square decimeter (dm²)</option>
                            <option value="cm2" data-i18n-unit data-unit-display="cm²">square centimeter (cm²)</option>
                        </optgroup>
                        <optgroup label="Traditional" data-unit-group="traditional">
                            <option value="jutro" data-i18n-unit data-unit-display="jutro">jutro (jutro)</option>
                        </optgroup>
                        <optgroup label="Imperial" data-unit-group="imperial">
                            <option value="ac" data-i18n-unit data-unit-display="ac">acre (ac)</option>
                            <option value="mi2" data-i18n-unit data-unit-display="mi²">square mile (mi²)</option>
                            <option value="yd2" data-i18n-unit data-unit-display="yd²">square yard (yd²)</option>
                            <option value="ft2" data-i18n-unit data-unit-display="ft²">square foot (ft²)</option>
                            <option value="in2" data-i18n-unit data-unit-display="in²">square inch (in²)</option>
                        </optgroup>
                    </select>
                </div>

                <button class="swap-btn" id="swap-btn" type="button" data-i18n-aria-label="area_swap" aria-label="Swap units">⇄</button>

                <div class="unit-select-group">
                    <label for="to-unit" data-i18n="area_to">To</label>
                    <select id="to-unit" aria-label="To unit">
                        <optgroup label="Metric" data-unit-group="metric">
                            <option value="km2" data-i18n-unit data-unit-display="km²">square kilometer (km²)</option>
                            <option value="ha" data-i18n-unit data-unit-display="ha">hectare (ha)</option>
                            <option value="ar" data-i18n-unit data-unit-display="a">are (a)</option>
                            <option value="m2" data-i18n-unit data-unit-display="m²">square meter (m²)</option>
                            <option value="dm2" data-i18n-unit data-unit-display="dm²">square decimeter (dm²)</option>
                            <option value="cm2" data-i18n-unit data-unit-display="cm²">square centimeter (cm²)</option>
                        </optgroup>
                        <optgroup label="Traditional" data-unit-group="traditional">
                            <option value="jutro" data-i18n-unit data-unit-display="jutro">jutro (jutro)</option>
                        </optgroup>
                        <optgroup label="Imperial" data-unit-group="imperial">
                            <option value="ac" data-i18n-unit data-unit-display="ac" selected>acre (ac)</option>
                            <option value="mi2" data-i18n-unit data-unit-display="mi²">square mile (mi²)</option>
                            <option value="yd2" data-i18n-unit data-unit-display="yd²">square yard (yd²)</option>
                            <option value="ft2" data-i18n-unit data-unit-display="ft²">square foot (ft²)</option>
                            <option value="in2" data-i18n-unit data-unit-display="in²">square inch (in²)</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <input type="number" id="area-input" class="length-input"
                   placeholder="Enter value" min="0" step="any"
                   data-i18n-placeholder="area_enter_value"
                   aria-label="Value to convert">

            <div class="length-btn-group">
                <button id="convert-btn" class="length-convert-btn" type="button" data-i18n="area_convert">Convert</button>
                <button id="reset-btn" class="length-reset-btn" type="button" data-i18n="area_reset">Reset</button>
            </div>

            <div id="area-result" class="length-result" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
    </div>

    <div class="version-info">v2.0.0</div>
    <script defer src="register-sw.js?v=2.0.0"></script>
    <script defer src="mobile-unit-picker.js?v=2.0.0"></script>
    <script defer src="area.js?v=2.0.0"></script>
</body>
</html>
