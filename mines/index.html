<!DOCTYPE html>
<html lang="en">
<head>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mines</title>
</head>
<body>
    
    <main class="container">
        <div class="top-bar">
           <div class="my-bet">Bet: 0</div><div class="message"></div><div class="balance"></div>
        </div>
        </div>
        <div class="controls">
        <div class="bet-control">
            <button id="min-bet">min</button><button id="bet-minus">-</button><button id="bet-plus">+</button><button id="max-bet">max</button>
        </div>
        <div class="mines-control">
            <button id="add-minus">-</button><div class="mine-panel"><div class="mines">mines</div><div class="mines-num">2</div></div><button id="add-plus">+</button>
        </div>
        <button id="start">Start Game</button>
        <div class="rest-collect">
            <button id="restart">Restart</button><button id="collect">Collect</button>
        </div>
    </div>
        <div class="grid-container">
            <div id="1" class="field"></div>
            <div id="2" class="field"></div>
            <div id="3" class="field"></div>
            <div id="4" class="field"></div>
            <div id="5" class="field"></div>
            <div id="6" class="field"></div>
            <div id="7" class="field"></div>
            <div id="8" class="field"></div>
            <div id="9" class="field"></div>
            <div id="10" class="field"></div>
            <div id="11" class="field"></div>
            <div id="12" class="field"></div>
            <div id="13" class="field"></div>
            <div id="14" class="field"></div>
            <div id="15" class="field"></div>
            <div id="16" class="field"></div>
            <div id="17" class="field"></div>
            <div id="18" class="field"></div>
            <div id="19" class="field"></div>
            <div id="20" class="field"></div>
            <div id="21" class="field"></div>
            <div id="22" class="field"></div>
            <div id="23" class="field"></div>
            <div id="24" class="field"></div>
            <div id="25" class="field"></div>
        </div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
