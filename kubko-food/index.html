<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json" />
    <title>Kubkova výživová kalkulačka</title>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./img/baby.svg" alt="">
            <p>KUBKO</p>
            <p>Výživová kalkulačka</p>
        </div>
        <p id="result"></p>
        <input id="package" type="number" placeholder="Veľkosť balenia (g)">
        <input id="feedingBottle" type="number" placeholder="Porcia vo ml (voda)">
        <input id="dailyInterval" type="number" placeholder="Denný interval">
        <button id="submit">Vypočítať</button>
        <div class="separator"></div>
        <p id="result2"></p>
        <input id="babyWeight" type="number" placeholder="Hmotnosť bábätka kg">
        <input id="feedPortion" type="number" placeholder="Množstvo/kg (160-180g)">
        <input id="interval2" type="number" placeholder="Denný interval">
        <button id="submit2">Vypočítať</button>
    </div>
</div>
    <script src="./app.js"></script>
</body>
</html>
